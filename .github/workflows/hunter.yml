name: 🕷️ 4K Spider Hunter Bot

on:
  schedule:
    - cron: '0 2 * * *'  # Chạy mỗi ngày lúc 2:00 AM UTC (9:00 AM Việt Nam)
  workflow_dispatch:      # Cho phép chạy thủ công từ GitHub

jobs:
  run-hunter:
    name: Run 4K Hunter Bot
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./server

      - name: Run 4K Hunter Bot
        run: node scripts/run_hunter.js
        working-directory: ./server
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          JACKETT_API_URL: ${{ secrets.JACKETT_API_URL }}
          JACKETT_API_KEY: ${{ secrets.JACKETT_API_KEY }}
