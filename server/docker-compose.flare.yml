version: '3.8'
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
    volumes: []

# Usage:
# docker compose -f docker-compose.flare.yml up -d
# Then set FLARESOLVERR_URL=http://localhost:8191/v1 in your environment.
